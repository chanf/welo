openapi: 3.0.3
info:
  title: Welo Task Management API
  version: 1.0.0
  description: |
    Welo 多团队任务管理系统 V1 API。
    后端部署目标为 Cloudflare Workers，主数据库为 Cloudflare D1。
    所有项目、任务、工作台和甘特图数据都必须在服务端执行团队/小组可见性校验。
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Feedback
  - name: Users
  - name: Teams
  - name: Groups
  - name: Projects
  - name: Tasks
  - name: Dashboard
  - name: Admin
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 注册并创建会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '423': { $ref: '#/components/responses/AccountLocked' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      responses:
        '200': { $ref: '#/components/responses/SuccessNull' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /public/feedback:
    post:
      tags: [Feedback]
      summary: 提交登录页用户留言
      description: 公开接口。后端校验后将留言发送到 Telegram，不在数据库保存留言内容。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '201':
          description: 留言已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TelegramUnavailable' }
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前用户和可访问团队
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /users/me:
    patch:
      tags: [Users]
      summary: 更新个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams:
    get:
      tags: [Teams]
      summary: 当前用户可访问团队
      responses:
        '200':
          description: 团队列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamListEnvelope' }
    post:
      tags: [Teams]
      summary: 创建团队（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamWriteRequest' }
      responses:
        '201':
          description: 团队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: 团队详情
      responses:
        '200':
          description: 团队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Teams]
      summary: 更新或归档团队（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamUpdateRequest' }
      responses:
        '200':
          description: 团队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: 团队成员列表（仅超管）
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Teams]
      summary: 添加团队成员（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberAddRequest' }
      responses:
        '201':
          description: 成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}/members/{userId}:
    delete:
      tags: [Teams]
      summary: 移出团队成员（仅超管）
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/SuccessNull' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}/groups:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Groups]
      summary: 团队小组列表
      responses:
        '200':
          description: 小组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupListEnvelope' }
    post:
      tags: [Groups]
      summary: 创建小组（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupWriteRequest' }
      responses:
        '201':
          description: 小组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/GroupId'
    patch:
      tags: [Groups]
      summary: 更新或停用小组（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdateRequest' }
      responses:
        '200':
          description: 小组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/groups/{groupId}/members:
    get:
      tags: [Groups]
      summary: 查询小组成员
      description: 超级管理员可查询任意小组成员；普通成员仅可查询自己所属的小组。
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 小组成员引用列表，openTaskCount 为该成员在当前团队的未完成任务数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMemberListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Groups]
      summary: 添加小组成员（仅超管）
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberAddRequest' }
      responses:
        '201':
          description: 成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}/groups/{groupId}/members/{userId}:
    delete:
      tags: [Groups]
      summary: 移出小组成员（仅超管）
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/SuccessNull' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/projects:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Projects]
      summary: 项目列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '200':
          description: 项目分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Projects]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: 项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: 项目详情
      responses:
        '200':
          description: 项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: 更新或归档项目（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200':
          description: 项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      summary: 软删除项目（仅超管）
      parameters:
        - name: confirmName
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        '200': { $ref: '#/components/responses/SuccessNull' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: 项目内可见任务列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TaskFiltersGroupId'
        - $ref: '#/components/parameters/TaskFiltersAssigneeId'
        - $ref: '#/components/parameters/TaskFiltersStatus'
        - $ref: '#/components/parameters/TaskFiltersPriority'
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: endDateFrom
          in: query
          schema: { type: string, format: date }
        - name: endDateTo
          in: query
          schema: { type: string, format: date }
        - name: sortBy
          in: query
          schema: { type: string, enum: [endDate, createdAt, priority], default: endDate }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: 任务分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tasks]
      summary: 创建任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{teamId}/projects/{projectId}/gantt:
    get:
      tags: [Tasks]
      summary: 甘特图数据
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskFiltersGroupId'
        - $ref: '#/components/parameters/TaskFiltersAssigneeId'
        - $ref: '#/components/parameters/TaskFiltersStatus'
        - $ref: '#/components/parameters/TaskFiltersPriority'
        - name: granularity
          in: query
          schema: { type: string, enum: [hour, halfDay, day], default: day }
      responses:
        '200':
          description: 甘特图范围和任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GanttEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: 任务详情
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      summary: 修改任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Tasks]
      summary: 软删除任务（仅超管）
      responses:
        '200': { $ref: '#/components/responses/SuccessNull' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/projects/{projectId}/tasks/{taskId}/schedule:
    patch:
      tags: [Tasks]
      summary: 甘特图拖拽保存排期
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdateRequest' }
      responses:
        '200':
          description: 最新任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /teams/{teamId}/dashboard:
    get:
      tags: [Dashboard]
      summary: 团队工作台数据
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: 工作台聚合数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/overview:
    get:
      tags: [Admin]
      summary: 平台概览（仅超管）
      responses:
        '200':
          description: 平台统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverviewEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users:
    get:
      tags: [Admin]
      summary: 全部用户列表（仅超管只读）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: systemRole
          in: query
          schema: { $ref: '#/components/schemas/SystemRole' }
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/projects:
    get:
      tags: [Admin]
      summary: 全部团队项目目录（仅超管只读）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
        - name: teamId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: 全部团队项目分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProjectPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: welo_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SessionToken
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string, maxLength: 100 }
    TaskFiltersGroupId:
      name: groupId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    TaskFiltersAssigneeId:
      name: assigneeId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    TaskFiltersStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/TaskStatus' }
    TaskFiltersPriority:
      name: priority
      in: query
      schema: { $ref: '#/components/schemas/TaskPriority' }
  responses:
    SuccessNull:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessNullEnvelope' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidCredentials:
      description: 用户名或密码错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AccountLocked:
      description: 账号锁定
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: 未登录或会话失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 资源不存在、已删除或当前用户不可见
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    VersionConflict:
      description: 数据版本冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 请求过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TelegramUnavailable:
      description: Telegram 配置缺失或发送失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Id:
      type: string
      pattern: '^[0-9]+$'
      example: '123'
    SystemRole:
      type: string
      enum: [super_admin, member]
    TeamStatus:
      type: string
      enum: [active, archived]
    GroupStatus:
      type: string
      enum: [active, disabled]
    ProjectStatus:
      type: string
      enum: [active, archived]
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
    TaskDateTime:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):(00|30)$'
      example: '2026-09-10T09:30'
      description: 本地任务时间，分钟按 30 分钟对齐
    TaskNullableDateTime:
      type: string
      nullable: true
      pattern: '^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):(00|30)$'
      example: '2026-09-10T09:30'
      description: 本地任务时间，分钟按 30 分钟对齐；可为空
    RegisterRequest:
